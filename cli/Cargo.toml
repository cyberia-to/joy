[package]
name = "cyber-joy"
version = "0.5.0"
edition = "2021"
description = "joy — the cyber warrior: executes, proves, verifies Trident programs on nox"
license-file = "../LICENSE"
repository = "https://github.com/cyberia-to/joy"
readme = "../README.md"
keywords = ["zk", "provable", "nox", "trident", "prover"]
categories = ["cryptography", "command-line-utilities"]

[[bin]]
name = "joy"
path = "main.rs"

[dependencies]
serde_json = "1"
joy-rs = { version = "0.5.0", path = "../rs" }
trident-lang = { version = "0.3.0", path = "../../trident" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
bbg = { version = "0.3.0", path = "../../bbg/rs", features = ["serde"] }
